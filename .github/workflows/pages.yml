name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build
        env:
          VITE_AUTH_ENABLED: "false"
        run: npm run build
      - name: Static snapshot
        run: |
          node --input-type=module << 'JS'
          import { writeFileSync } from "node:fs";
          const server = (await import("./node_modules/.nitro/vite/services/ssr/index.js")).default;
          const res = await server.fetch(new Request("http://localhost/"));
          const html = await res.text();
          const linked = [...html.matchAll(/\/assets\/[^"']+/g)].map((m) => m[0]);
          if (!res.ok || !html.includes("Spider-Man") || !linked.some((p) => p.endsWith(".css"))) {
            console.error("SSR snapshot is incomplete", res.status, linked);
            process.exit(1);
          }
          writeFileSync(".vercel/output/static/index.html", html);
          writeFileSync(".vercel/output/static/404.html", html);
          console.log("snapshot", html.length, "bytes", [...new Set(linked)].join(" "));
          JS
          printf '%s\n' codes.consolecheat.com > .vercel/output/static/CNAME
          touch .vercel/output/static/.nojekyll
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
